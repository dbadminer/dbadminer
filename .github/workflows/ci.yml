name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            tools/go.sum
            cmd/dbadminer/go.sum
            examples/http/go.sum
            examples/chi/go.sum
            examples/cobra/go.sum
      - name: vet
        run: |
          go vet ./...
          go -C cmd/dbadminer vet ./...
          go -C examples/http vet ./...
          go -C examples/chi vet ./...
          go -C examples/cobra vet ./...
      - name: fmt
        if: matrix.go == 'stable'
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: tidy
        if: matrix.go == 'stable'
        run: |
          go mod tidy
          (cd tools && go mod tidy)
          (cd cmd/dbadminer && go mod tidy)
          (cd examples/http && go mod tidy)
          (cd examples/chi && go mod tidy)
          (cd examples/cobra && go mod tidy)
          git diff --exit-code -- go.mod go.sum tools/go.mod tools/go.sum cmd/dbadminer/go.mod cmd/dbadminer/go.sum examples/http/go.mod examples/http/go.sum examples/chi/go.mod examples/chi/go.sum examples/cobra/go.mod examples/cobra/go.sum
      - name: lint
        if: matrix.go == 'stable'
        run: |
          root=$PWD
          go tool -modfile=tools/go.mod golangci-lint run ./...
          for dir in cmd/dbadminer examples/http examples/chi examples/cobra; do
            (cd "$dir" && go tool -modfile="$root/tools/go.mod" golangci-lint run ./...)
          done
      - name: test
        run: |
          go test -race -count=1 ./...
          go -C cmd/dbadminer test -race -count=1 ./...
          go -C examples/http test -count=1 ./...
          go -C examples/chi test -count=1 ./...
          go -C examples/cobra test -count=1 ./...
      - name: sqlite version
        run: go test -count=1 -v -run TestSQLiteVersion .
      - name: govulncheck
        run: |
          root=$PWD
          go tool -modfile=tools/go.mod govulncheck ./...
          for dir in cmd/dbadminer examples/http examples/chi examples/cobra; do
            go -C "$dir" tool -modfile="$root/tools/go.mod" govulncheck ./...
          done

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: check and build
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - name: committed UI is current
        run: git diff --exit-code -- ui

  postgres:
    name: postgres ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [14, 15, 16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: dbadminer
          POSTGRES_PASSWORD: dbadminer
          POSTGRES_DB: dbadminer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbadminer -d dbadminer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tools/go.sum
            cmd/dbadminer/go.sum
            examples/http/go.sum
            examples/chi/go.sum
            examples/cobra/go.sum
      - name: handlers via DATABASE_URL
        env:
          DBADMINER_INTEGRATION: "1"
          DATABASE_URL: postgres://dbadminer:dbadminer@127.0.0.1:5432/dbadminer?sslmode=disable
        run: go -C cmd/dbadminer test -tags integration -count=1 -timeout 20m ./...
      - name: handlers via libpq variables
        env:
          DBADMINER_INTEGRATION: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: dbadminer
          PGPASSWORD: dbadminer
          PGDATABASE: dbadminer
          PGSSLMODE: disable
        run: go -C cmd/dbadminer test -tags integration -count=1 -timeout 20m ./...

  mysql:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mysql 8
            image: mysql:8
          - name: mariadb 10
            image: mariadb:10
          - name: mariadb 11
            image: mariadb:11
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_USER: dbadminer
          MYSQL_PASSWORD: dbadminer
          MYSQL_DATABASE: dbadminer
          MYSQL_ROOT_PASSWORD: root
          MARIADB_USER: dbadminer
          MARIADB_PASSWORD: dbadminer
          MARIADB_DATABASE: dbadminer
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tools/go.sum
            cmd/dbadminer/go.sum
            examples/http/go.sum
            examples/chi/go.sum
            examples/cobra/go.sum
      - name: handlers via DATABASE_URL
        env:
          DBADMINER_INTEGRATION: "1"
          DATABASE_URL: mysql://dbadminer:dbadminer@127.0.0.1:3306/dbadminer
        run: go -C cmd/dbadminer test -tags integration -count=1 -timeout 20m ./...
      - name: handlers via MYSQL variables
        env:
          DBADMINER_INTEGRATION: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: dbadminer
          MYSQL_PASSWORD: dbadminer
          MYSQL_DATABASE: dbadminer
        run: go -C cmd/dbadminer test -tags integration -count=1 -timeout 20m ./...
